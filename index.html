<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Mahy4 Clicker</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<!-- Firebase (free cloud database, used only to store the leaderboard) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(180deg, #d9c9f5 0%, #cdbdf0 100%);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px 40px;
    color: #2c2440;
    user-select: none;
  }
  .label {
    letter-spacing: 2px;
    font-weight: 700;
    font-size: 14px;
    color: #6b5b95;
    text-transform: uppercase;
    margin-top: 12px;
  }
  .score {
    font-size: 64px;
    font-weight: 800;
    margin: 6px 0;
  }
  .sublabel {
    font-size: 14px;
    color: #6b5b95;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 18px;
  }
  .badge {
    background: #ffffffcc;
    border-radius: 30px;
    padding: 10px 22px;
    font-weight: 700;
    font-size: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.08);
    margin-bottom: 30px;
  }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #4caf82; }

  .cat-btn {
    width: 300px;
    height: 300px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #ffffff, #f2edfb);
    border: none;
    box-shadow: 0 10px 30px rgba(90, 60, 150, 0.25);
    font-size: 130px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: transform 0.08s ease;
    padding: 0;
    overflow: hidden;
  }
  .cat-btn img {
    width: 78%;
    height: 78%;
    object-fit: contain;
    pointer-events: none;
    display: block;
  }
  .cat-btn:active { transform: scale(0.94); }

  .record-box {
    width: 100%;
    max-width: 420px;
    background: #ffffffcc;
    border-radius: 16px;
    padding: 18px 22px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-weight: 700;
    margin-top: 36px;
    letter-spacing: 1px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.06);
  }
  .record-box span:first-child { color: #6b5b95; font-size: 14px; text-transform: uppercase; }
  .record-box span:last-child { font-size: 22px; }

  .leaderboard {
    width: 100%;
    max-width: 420px;
    background: #ffffffcc;
    border-radius: 16px;
    padding: 18px 22px;
    margin-top: 16px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.06);
  }
  .leaderboard h3 {
    margin: 0 0 12px;
    font-size: 14px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #6b5b95;
  }
  .lb-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 0;
    font-weight: 600;
    font-size: 15px;
    border-bottom: 1px solid #eee2fb;
  }
  .lb-row:last-child { border-bottom: none; }
  .lb-rank {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: #eee2fb;
    color: #6b5b95;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    margin-right: 10px;
  }
  .lb-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lb-score { color: #6b5b95; }
  .lb-empty { text-align: center; color: #9a8bc0; font-size: 14px; padding: 8px 0; }
</style>
</head>
<body>

  <div class="label">MEOW POINTS</div>
  <div class="score" id="score">0</div>
  <div class="sublabel">total points</div>

  <div class="badge"><span class="dot"></span> +1 per click</div>

  <button class="cat-btn" id="catBtn"><img src="cat.png" alt="cat"></button>

  <div class="record-box">
    <span>HIGH SCORE</span>
    <span id="record">0</span>
  </div>

  <div class="leaderboard">
    <h3>Top 5 players</h3>
    <div id="lbList"><div class="lb-empty">Loading...</div></div>
  </div>

<script>
  // ------------------------------------------------------------------
  // 1) FIREBASE SETUP
  // Replace the values below with your own Firebase project config.
  // How to get them: console.firebase.google.com -> create a project ->
  // Build -> Realtime Database -> Create Database (test mode) ->
  // Project settings -> add a Web App -> copy the firebaseConfig object.
  // ------------------------------------------------------------------
  const firebaseConfig = {
    apiKey: "AIzaSyCadhKMGJ0nc9fWuB5BsMEixTyXSTAmtnk",
    authDomain: "mahy4-clicker.firebaseapp.com",
    databaseURL: "https://mahy4-clicker-default-rtdb.firebaseio.com",
    projectId: "mahy4-clicker",
    storageBucket: "mahy4-clicker.firebasestorage.app",
    messagingSenderId: "268929934750",
    appId: "1:268929934750:web:8ed46729d81bf334bc628f"
  };

  let db = null;
  try {
    firebase.initializeApp(firebaseConfig);
    db = firebase.database();
  } catch (e) {
    console.warn("Firebase not configured yet:", e);
  }

  // ------------------------------------------------------------------
  // 2) TELEGRAM USER INFO
  // ------------------------------------------------------------------
  const tg = window.Telegram ? window.Telegram.WebApp : null;
  if (tg) tg.ready();

  const tgUser = tg && tg.initDataUnsafe && tg.initDataUnsafe.user ? tg.initDataUnsafe.user : null;
  const userId = tgUser ? String(tgUser.id) : "guest_" + Math.random().toString(36).slice(2, 10);
  const userName = tgUser
    ? (tgUser.username ? "@" + tgUser.username : [tgUser.first_name, tgUser.last_name].filter(Boolean).join(" "))
    : "Guest";

  // ------------------------------------------------------------------
  // 3) CLICKER LOGIC
  // ------------------------------------------------------------------
  const scoreEl = document.getElementById("score");
  const recordEl = document.getElementById("record");
  const catBtn = document.getElementById("catBtn");
  const lbList = document.getElementById("lbList");

  let score = parseInt(localStorage.getItem("mahy_score") || "0", 10);
  let record = parseInt(localStorage.getItem("mahy_record") || "0", 10);
  scoreEl.textContent = score;
  recordEl.textContent = record;

  let saveTimeout = null;

  // ------------------------------------------------------------------
  // SOUND — a short synthesized "meow-click" blip, no audio file needed
  // ------------------------------------------------------------------
  let audioCtx = null;
  function playClickSound() {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(700, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(300, audioCtx.currentTime + 0.12);
      gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.13);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.13);
    } catch (e) {}
  }

  catBtn.addEventListener("click", () => {
    score++;
    if (score > record) record = score;
    scoreEl.textContent = score;
    recordEl.textContent = record;

    playClickSound();

    localStorage.setItem("mahy_score", score);
    localStorage.setItem("mahy_record", record);

    if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred("light");

    // Debounce writes to the database so we are not spamming it on every click
    clearTimeout(saveTimeout);
    saveTimeout = setTimeout(saveScoreToLeaderboard, 500);
  });

  function saveScoreToLeaderboard() {
    if (!db) return;
    db.ref("leaderboard/" + userId).set({
      name: userName,
      score: record,
      updatedAt: Date.now()
    });
  }

  function renderLeaderboard(entries) {
    if (!entries.length) {
      lbList.innerHTML = '<div class="lb-empty">No scores yet — be the first!</div>';
      return;
    }
    lbList.innerHTML = entries.map((e, i) => `
      <div class="lb-row">
        <div style="display:flex; align-items:center; overflow:hidden;">
          <span class="lb-rank">${i + 1}</span>
          <span class="lb-name">${escapeHtml(e.name)}</span>
        </div>
        <span class="lb-score">${e.score}</span>
      </div>
    `).join("");
  }

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  function listenToLeaderboard() {
    if (!db) {
      lbList.innerHTML = '<div class="lb-empty">Leaderboard not connected yet</div>';
      return;
    }
    db.ref("leaderboard").orderByChild("score").limitToLast(5).on("value", (snap) => {
      const val = snap.val() || {};
      const entries = Object.values(val).sort((a, b) => b.score - a.score);
      renderLeaderboard(entries);
    });
  }

  listenToLeaderboard();
  // Save the score once on load too, so first-time visitors appear on the board
  if (record > 0) saveScoreToLeaderboard();
</script>
</body>
</html>
