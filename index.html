<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MeowClick</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --charcoal:#2b2b30;
    --cream:#fdfaf6;
    --blush:#ff8fab;
    --mint:#7cd9c0;
    --lavender:#eae3f5;
    --violet-deep:#5b4b8a;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; padding:0; height:100%;
    overflow:hidden;
    background:
      radial-gradient(circle at 50% 0%, var(--lavender) 0%, #d9cdf0 55%, #c3b3e6 100%);
    font-family:'Nunito', sans-serif;
    touch-action:manipulation;
    user-select:none;
  }
  @font-face{
    font-family:'Baloo';
    src:local('Baloo 2');
  }
  #app{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:space-between;
    height:100%;
    width:100%;
    padding:env(safe-area-inset-top,18px) 16px env(safe-area-inset-bottom,18px);
    position:relative;
  }

  /* HEADER */
  .header{
    width:100%;
    text-align:center;
    padding-top:14px;
  }
  .eyebrow{
    font-size:12px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--violet-deep);
    font-weight:800;
    opacity:.65;
  }
  .score{
    font-family:'Baloo 2','Fredoka',sans-serif;
    font-weight:800;
    font-size:64px;
    line-height:1;
    color:var(--charcoal);
    margin-top:6px;
    letter-spacing:-0.02em;
    transition:transform .08s ease;
  }
  .score.bump{ transform:scale(1.08); }
  .score-label{
    margin-top:4px;
    font-size:13px;
    color:var(--violet-deep);
    font-weight:700;
    opacity:.7;
  }
  .rate{
    margin-top:10px;
    display:inline-flex;
    align-items:center;
    gap:6px;
    background:rgba(255,255,255,.55);
    border:1px solid rgba(91,75,138,.15);
    padding:6px 14px;
    border-radius:999px;
    font-size:13px;
    font-weight:700;
    color:var(--violet-deep);
  }
  .rate .dot{
    width:8px;height:8px;border-radius:50%;
    background:var(--mint);
    box-shadow:0 0 0 4px rgba(124,217,192,.25);
  }

  /* CLICK ZONE */
  .click-zone{
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    width:100%;
    flex:1;
  }
  .glow{
    position:absolute;
    width:290px;height:290px;
    border-radius:50%;
    background:radial-gradient(circle, rgba(255,143,171,.35) 0%, rgba(255,143,171,0) 70%);
    animation:pulse 2.4s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{ transform:scale(1); opacity:.8;}
    50%{ transform:scale(1.08); opacity:1;}
  }
  #catBtn{
    position:relative;
    width:250px;
    height:250px;
    border-radius:50%;
    border:none;
    background:
      linear-gradient(145deg, #ffffff, #f1ebfb);
    box-shadow:
      0 18px 30px -10px rgba(91,75,138,.45),
      0 2px 0 rgba(255,255,255,.6) inset,
      0 -6px 14px rgba(91,75,138,.12) inset;
    padding:14px;
    cursor:pointer;
    transition:transform .06s ease;
  }
  #catBtn img{
    width:100%;
    height:100%;
    object-fit:contain;
    pointer-events:none;
    filter:drop-shadow(0 6px 10px rgba(0,0,0,.15));
  }
  #catBtn:active{
    transform:scale(.92);
  }
  #catBtn.squish{
    animation:squish .18s ease;
  }
  @keyframes squish{
    0%{ transform:scale(.9) rotate(0deg); }
    50%{ transform:scale(1.05) rotate(-2deg); }
    100%{ transform:scale(1) rotate(0deg); }
  }

  .floatnum{
    position:absolute;
    font-family:'Baloo 2','Fredoka',sans-serif;
    font-weight:800;
    font-size:22px;
    color:#ffffff;
    pointer-events:none;
    animation:float-up .85s ease-out forwards;
    text-shadow:0 2px 6px rgba(0,0,0,.35), 0 0 3px rgba(0,0,0,.25);
  }
  @keyframes float-up{
    0%{ transform:translateY(0) scale(.8); opacity:0;}
    15%{ opacity:1; transform:translateY(-10px) scale(1.1);}
    100%{ transform:translateY(-90px) scale(1); opacity:0;}
  }

  .heart{
    position:absolute;
    pointer-events:none;
    font-size:16px;
    animation:heart-pop 1s ease-out forwards;
  }
  @keyframes heart-pop{
    0%{ transform:translate(0,0) scale(.5) rotate(0deg); opacity:1;}
    100%{ transform:translate(var(--tx), var(--ty)) scale(1.1) rotate(var(--rot)); opacity:0;}
  }

  /* FOOTER */
  .footer{
    width:100%;
    max-width:340px;
    padding-bottom:6px;
  }
  .best{
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:rgba(255,255,255,.55);
    border:1px solid rgba(91,75,138,.15);
    border-radius:16px;
    padding:12px 16px;
  }
  .best-label{
    font-size:12px;
    font-weight:800;
    color:var(--violet-deep);
    opacity:.65;
    text-transform:uppercase;
    letter-spacing:.08em;
  }
  .best-value{
    font-family:'Baloo 2','Fredoka',sans-serif;
    font-weight:800;
    font-size:20px;
    color:var(--charcoal);
  }
</style>
</head>

  <div class="footer">
    <div class="best">
      <span class="best-label">Рекорд</span>
      <span class="best-value" id="best">0</span>
    </div>
  </div>

</div>

<script>
  const tg = window.Telegram ? window.Telegram.WebApp : null;
  if (tg) { tg.ready(); tg.expand(); }

  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const catBtn = document.getElementById('catBtn');
  const app = document.getElementById('app');

  let audioCtx = null;

  function playClickSound() {
    try {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') audioCtx.resume();

      const now = audioCtx.currentTime;
      const masterGain = audioCtx.createGain();
      masterGain.gain.setValueAtTime(0.28, now);
      masterGain.connect(audioCtx.destination);

      // Warm, round "pop" body: pitch glides down through a soft lowpass filter
      const body = audioCtx.createOscillator();
      body.type = 'sine';
      body.frequency.setValueAtTime(620, now);
      body.frequency.exponentialRampToValueAtTime(240, now + 0.14);

      const filter = audioCtx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(2200, now);
      filter.frequency.exponentialRampToValueAtTime(500, now + 0.15);
      filter.Q.value = 0.7;

      const bodyGain = audioCtx.createGain();
      bodyGain.gain.setValueAtTime(0, now);
      bodyGain.gain.linearRampToValueAtTime(0.9, now + 0.008);
      bodyGain.gain.exponentialRampToValueAtTime(0.001, now + 0.19);

      body.connect(filter);
      filter.connect(bodyGain);
      bodyGain.connect(masterGain);

      // Gentle sparkle on top, soft and short, for a bit of shine
      const sparkle = audioCtx.createOscillator();
      sparkle.type = 'triangle';
      sparkle.frequency.setValueAtTime(1400, now);
      sparkle.frequency.exponentialRampToValueAtTime(1100, now + 0.08);

      const sparkleGain = audioCtx.createGain();
      sparkleGain.gain.setValueAtTime(0, now);
      sparkleGain.gain.linearRampToValueAtTime(0.12, now + 0.006);
      sparkleGain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);

      sparkle.connect(sparkleGain);
      sparkleGain.connect(masterGain);

      // Soft echo tail for a little space, like a gentle room
      const echo = audioCtx.createDelay();
      echo.delayTime.value = 0.09;
      const echoGain = audioCtx.createGain();
      echoGain.gain.value = 0.15;
      masterGain.connect(echo);
      echo.connect(echoGain);
      echoGain.connect(audioCtx.destination);

      body.start(now);
      body.stop(now + 0.2);
      sparkle.start(now);
      sparkle.stop(now + 0.1);
    } catch(e) {}
  }

  let score = 0;
  let best = 0;

  try {
    score = parseInt(localStorage.getItem('meow_score') || '0', 10);
    best = parseInt(localStorage.getItem('meow_best') || '0', 10);
  } catch(e) {}

  scoreEl.textContent = score;
  bestEl.textContent = best;

  function spawnFloatNumber(x, y) {
    const el = document.createElement('div');
    el.className = 'floatnum';
    el.textContent = '+1';
    el.style.left = (x - 12) + 'px';
    el.style.top = (y - 20) + 'px';
    app.appendChild(el);
    setTimeout(() => el.remove(), 900);
  }

  // --- Anti-cheat: only a single finger counts, plus a silent speed limit ---
  const MIN_INTERVAL_MS = 90; // fastest a tap can be counted, no matter the input

  let lastAcceptedTapTime = 0;

  function passesSpeedLimit() {
    const now = performance.now();
    if (now - lastAcceptedTapTime < MIN_INTERVAL_MS) return false;
    lastAcceptedTapTime = now;
    return true;
  }

  function handleTap(clientX, clientY) {
    if (!passesSpeedLimit()) return;

    playClickSound();
    score += 1;
    if (score > best) {
      best = score;
      bestEl.textContent = best;
    }
    scoreEl.textContent = score;
    scoreEl.classList.remove('bump');
    requestAnimationFrame(() => scoreEl.classList.add('bump'));

    catBtn.classList.remove('squish');
    requestAnimationFrame(() => catBtn.classList.add('squish'));

    const rect = app.getBoundingClientRect();
    const x = clientX - rect.left;
    const y = clientY - rect.top;
    spawnFloatNumber(x, y);

    try {
      localStorage.setItem('meow_score', score);
      localStorage.setItem('meow_best', best);
    } catch(e) {}

    if (tg && tg.HapticFeedback) {
      tg.HapticFeedback.impactOccurred('light');
    }
  }

  let lastTouchTime = 0;
  let maxSimultaneousTouches = 0;

  catBtn.addEventListener('touchstart', (e) => {
    e.preventDefault();
    maxSimultaneousTouches = Math.max(maxSimultaneousTouches, e.touches.length);
  }, { passive:false });

  catBtn.addEventListener('touchend', (e) => {
    e.preventDefault();
    if (e.touches.length === 0) {
      // Only register if exactly one finger was ever down during this gesture
      if (maxSimultaneousTouches === 1) {
        lastTouchTime = Date.now();
        const t = e.changedTouches[0];
        handleTap(t.clientX, t.clientY);
      }
      maxSimultaneousTouches = 0;
    }
  }, { passive:false });

  catBtn.addEventListener('touchcancel', (e) => {
    if (e.touches.length === 0) maxSimultaneousTouches = 0;
  });

  catBtn.addEventListener('click', (e) => {
    // Skip click if it was just triggered by a touch (avoids double counting on mobile)
    if (Date.now() - lastTouchTime < 500) return;
    handleTap(e.clientX, e.clientY);
  });
</script>
