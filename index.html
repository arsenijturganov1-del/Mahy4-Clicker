    adminRebirthApply.addEventListener("click", () => {
      const raw = adminRebirthTarget.value.trim();
      const amount = parseInt(adminRebirthAmount.value, 10);
      if (!raw || !Number.isFinite(amount) || amount === 0) return;
      const user = findUserByQuery(raw);
      if (!user) {
        alert("Player not found. They must open the game at least once.");
        return;
      }
      db.ref("leaderboard/" + user.id).once("value").then((snap) => {
        const data = snap.val() || {};
        const newRebirths = Math.max(0, (data.rebirths || 0) + amount);
        return db.ref("leaderboard/" + user.id).update({ rebirths: newRebirths });
      }).then(() => {
        adminRebirthTarget.value = "";
        adminRebirthAmount.value = "";
        loadAdminList();
      }).catch((err) => {
        console.error("Admin rebirth give failed:", err);
        alert("Failed to save: " + err.message);
      });
    });
  }
  function setupAboutPanel() {
    aboutToggle.addEventListener("click", () => {
      aboutOverlay.style.display = "flex";
    });
    aboutClose.addEventListener("click", () => {
      aboutOverlay.style.display = "none";
    });
    aboutOverlay.addEventListener("click", (e) => {
      if (e.target === aboutOverlay) aboutOverlay.style.display = "none";
    });
    if (tg && tg.openLink) {
      const tiktokLink = document.getElementById("aboutTiktok");
      const youtubeLink = document.getElementById("aboutYoutube");
      [tiktokLink, youtubeLink].forEach((el) => {
        el.addEventListener("click", (e) => {
          e.preventDefault();
          tg.openLink(el.href);
        });
      });
    }
    if (tg && tg.openTelegramLink) {
      const telegramLink = document.getElementById("aboutTelegram");
      telegramLink.addEventListener("click", (e) => {
        e.preventDefault();
        tg.openTelegramLink(telegramLink.href);
      });
    }
  }
  function applyVolumeUI() {
    const pct = Math.round(masterVolume * 100);
    volumeBarFill.style.width = pct + "%";
    volumeValueLabel.textContent = pct + "%";
    settingsToggle.textContent = masterVolume <= 0 ? "🔇" : "🔊";
  }
  function setVolume(v) {
    masterVolume = Math.min(1, Math.max(0, Math.round(v * 100) / 100));
    localStorage.setItem("mahy_volume", masterVolume);
    applyVolumeUI();
  }
  function setupSettingsPanel() {
    applyVolumeUI();
    settingsToggle.addEventListener("click", () => {
      settingsOverlay.style.display = "flex";
    });
    settingsClose.addEventListener("click", () => {
      settingsOverlay.style.display = "none";
    });
    settingsOverlay.addEventListener("click", (e) => {
      if (e.target === settingsOverlay) settingsOverlay.style.display = "none";
    });
    volumeDown.addEventListener("click", () => setVolume(masterVolume - 0.1));
    volumeUp.addEventListener("click", () => setVolume(masterVolume + 0.1));
  }
  setupAccountBox();
  setupAdminPanel();
  setupAboutPanel();
  setupSettingsPanel();
  listenToLeaderboard();
  initPlayer();
</script>
</body>
</html>
