<html lang="en">

<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(180deg, #d9c9f5 0%, #cdbdf0 100%);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px 40px;
    color: #2c2440;
    user-select: none;
  }
  .label {
    letter-spacing: 2px;
    font-weight: 700;
    font-size: 14px;
    color: #6b5b95;
    text-transform: uppercase;
    margin-top: 12px;
  }
  .score {
    font-size: 64px;
    font-weight: 800;
    margin: 6px 0;
  }
  .sublabel {
    font-size: 14px;
    color: #6b5b95;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 18px;
  }
  .badge {
    background: #ffffffcc;
    border-radius: 30px;
    padding: 10px 22px;
    font-weight: 700;
    font-size: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.08);
    margin-bottom: 30px;
  }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #4caf82; }

  .cat-wrap {
    position: relative;
    width: 300px;
    height: 300px;
  }

  .cat-btn {
    width: 300px;
    height: 300px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #ffffff, #f2edfb);
    border: none;
    box-shadow: 0 10px 30px rgba(90, 60, 150, 0.25);
    font-size: 130px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: transform 0.08s ease;
    padding: 0;
    overflow: hidden;
    position: relative;
    z-index: 2;
  }
  .cat-btn img {
    width: 78%;
    height: 78%;
    object-fit: contain;
    pointer-events: none;
    display: block;
  }
  .cat-btn:active { transform: scale(0.94); }

  .cat-btn.pop {
    animation: catPop 0.32s cubic-bezier(.36,1.7,.5,1);
  }
  @keyframes catPop {
    0%   { transform: scale(1) rotate(0deg); }
    30%  { transform: scale(0.88) rotate(-4deg); }
    55%  { transform: scale(1.12) rotate(3deg); }
    75%  { transform: scale(0.98) rotate(-1deg); }
    100% { transform: scale(1) rotate(0deg); }
  }

  .ring-pulse {
    position: absolute;
    top: 50%; left: 50%;
    width: 300px; height: 300px;
    border-radius: 50%;
    border: 4px solid rgba(140, 100, 220, 0.55);
    transform: translate(-50%, -50%) scale(0.8);
    opacity: 0.9;
    pointer-events: none;
    z-index: 1;
    animation: ringOut 0.55s ease-out forwards;
  }
  @keyframes ringOut {
    0%   { transform: translate(-50%, -50%) scale(0.75); opacity: 0.8; }
    100% { transform: translate(-50%, -50%) scale(1.25); opacity: 0; }
  }

  .float-pts {
    position: absolute;
    font-weight: 800;
    font-size: 24px;
    color: #7c4fdd;
    text-shadow: 0 2px 6px rgba(255,255,255,0.7);
    pointer-events: none;
    z-index: 3;
    animation: floatUp 0.85s ease-out forwards;
  }
  @keyframes floatUp {
    0%   { opacity: 0; transform: translate(-50%, -50%) scale(0.6); }
    15%  { opacity: 1; transform: translate(-50%, -50%) scale(1.15); }
    100% { opacity: 0; transform: translate(calc(-50% + var(--dx, 0px)), -160%) scale(1); }
  }

  .upgrade-box {
    width: 100%;
    max-width: 420px;
    background: #ffffffcc;
    border-radius: 16px;
    padding: 16px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 30px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.06);
  }
  .upgrade-info { display: flex; flex-direction: column; gap: 2px; }
  .upgrade-title { font-size: 13px; text-transform: uppercase; letter-spacing: 1px; color: #6b5b95; font-weight: 700; }
  .upgrade-sub { font-size: 13px; color: #8b7bb5; font-weight: 600; }
  .upgrade-btn {
    border: none;
    border-radius: 14px;
    padding: 14px 20px;
    font-size: 15px;
    font-weight: 800;
    color: #fff;
    background: linear-gradient(135deg, #9c6bff, #6f4fe8);
    box-shadow: 0 6px 16px rgba(111, 79, 232, 0.4);
    cursor: pointer;
    transition: transform 0.12s ease, box-shadow 0.12s ease, filter 0.12s ease;
    white-space: nowrap;
  }
  .upgrade-btn:active { transform: scale(0.94); }
  .upgrade-btn.disabled {
    background: #c9c1e0;
    box-shadow: none;
    cursor: not-allowed;
    filter: grayscale(0.3);
  }
  .upgrade-btn.bought {
    animation: upgradeFlash 0.5s ease;
  }
  @keyframes upgradeFlash {
    0%   { transform: scale(1); filter: brightness(1); }
    40%  { transform: scale(1.12); filter: brightness(1.4); }
    100% { transform: scale(1); filter: brightness(1); }
  }
  .upgrade-btn.shake {
    animation: shakeNo 0.4s ease;
  }
  @keyframes shakeNo {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-6px); }
    40% { transform: translateX(6px); }
    60% { transform: translateX(-4px); }
    80% { transform: translateX(4px); }
  }

  .rebirth-box {
    margin-top: 16px;
  }
  .rebirth-btn {
    background: linear-gradient(135deg, #ffd36b, #ff9f4f);
    box-shadow: 0 6px 16px rgba(255, 159, 79, 0.4);
  }
  .rebirth-btn.disabled {
    background: #c9c1e0;
    box-shadow: none;
    cursor: not-allowed;
    filter: grayscale(0.3);
  }
  .rebirth-btn.locked {
    background: #d9d2ee;
    box-shadow: none;
    cursor: not-allowed;
    filter: grayscale(0.5);
  }

  .cat-wrap.locked .cat-btn {
    filter: grayscale(0.6) brightness(0.85);
    opacity: 0.75;
    cursor: not-allowed;
  }

  .record-box {
    width: 100%;
    max-width: 420px;
    background: #ffffffcc;
    border-radius: 16px;
    padding: 18px 22px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-weight: 700;
    margin-top: 36px;
    letter-spacing: 1px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.06);
  }
  .record-box span:first-child { color: #6b5b95; font-size: 14px; text-transform: uppercase; }
  .record-box span:last-child { font-size: 22px; }

  .leaderboard {
    width: 100%;
    max-width: 420px;
    background: #ffffffcc;
    border-radius: 16px;
    padding: 18px 22px;
    margin-top: 16px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.06);
  }
  .leaderboard h3 {
    margin: 0 0 12px;
    font-size: 14px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #6b5b95;
  }
  .lb-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 0;
    font-weight: 600;
    font-size: 15px;
    border-bottom: 1px solid #eee2fb;
  }
  .lb-row:last-child { border-bottom: none; }
  .lb-rank {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: #eee2fb;
    color: #6b5b95;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    margin-right: 10px;
  }
  .lb-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lb-score { color: #6b5b95; }
  .lb-empty { text-align: center; color: #9a8bc0; font-size: 14px; padding: 8px 0; }

  .admin-toggle {
    position: fixed;
    top: 16px;
    right: 16px;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: none;
    background: #2c2440;
    color: #fff;
    font-size: 20px;
    display: none;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 6px 16px rgba(0,0,0,0.3);
    z-index: 200;
  }

  .admin-overlay {
    position: fixed;
    inset: 0;
    background: rgba(20, 12, 40, 0.55);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 300;
  }
  .admin-panel {
    width: 100%;
    max-width: 460px;
    max-height: 80vh;
    background: #fff;
    border-radius: 20px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .admin-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
    font-weight: 800;
    font-size: 16px;
    color: #2c2440;
  }
  .admin-header button {
    border: none;
    background: #eee2fb;
    color: #6f4fe8;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    font-weight: 800;
    cursor: pointer;
  }
  .admin-list {
    overflow-y: auto;
  }
  .admin-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px solid #eee2fb;
  }
  .admin-row:last-child { border-bottom: none; }
  .admin-row-name { font-weight: 700; font-size: 14px; color: #2c2440; }
  .admin-row-meta { font-size: 12px; color: #9a8bc0; margin-top: 2px; }
  .admin-row-actions { display: flex; align-items: center; gap: 6px; }
  .admin-add-input {
    width: 70px;
    border: 1px solid #eee2fb;
    border-radius: 10px;
    padding: 8px 8px;
    font-size: 12px;
    font-weight: 700;
    color: #2c2440;
    text-align: center;
  }
  .admin-add-btn {
    border: none;
    border-radius: 10px;
    padding: 8px 12px;
    font-size: 12px;
    font-weight: 700;
    color: #fff;
    background: #4caf82;
    cursor: pointer;
    white-space: nowrap;
  }
  .admin-reset-btn {
    border: none;
    border-radius: 10px;
    padding: 8px 12px;
    font-size: 12px;
    font-weight: 700;
    color: #fff;
    background: #ff5b5b;
    cursor: pointer;
    white-space: nowrap;
  }
</style>
</head>
<body>

  <div class="label">MEOW POINTS</div>
  <div class="score" id="score">0</div>
  <div class="sublabel">total points</div>

  <div class="badge"><span class="dot"></span> <span id="perClickLabel">+1 per click</span></div>

  <div class="cat-wrap" id="catWrap">
    <button class="cat-btn" id="catBtn"><img src="cat.png" alt="cat"></button>
  </div>

  <div class="record-box">
    <span>HIGH SCORE</span>
    <span id="record">0</span>
  </div>

  <div class="upgrade-box">
    <div class="upgrade-info">
      <span class="upgrade-title">Click power: <span id="ppcVal">1</span></span>
      <span class="upgrade-sub" id="upgradeCostLabel">Cost: 20</span>
    </div>
    <button class="upgrade-btn" id="upgradeBtn">⬆ Upgrade</button>
  </div>

  <div class="upgrade-box rebirth-box" id="rebirthBox">
    <div class="upgrade-info">
      <span class="upgrade-title">Rebirth: <span id="rebirthMultVal">x1</span></span>
      <span class="upgrade-sub" id="rebirthCostLabel">Locked — reach 10,000 points</span>
    </div>
    <button class="upgrade-btn rebirth-btn locked" id="rebirthBtn">🔁 Rebirth</button>
  </div>

  <div class="leaderboard">
    <h3>Top 5 players</h3>
    <div id="lbList"><div class="lb-empty">Loading...</div></div>
  </div>

  <button class="admin-toggle" id="adminToggle">⚙</button>
  <div class="admin-overlay" id="adminOverlay">
    <div class="admin-panel">
      <div class="admin-header">
        <span>Admin panel</span>
        <button id="adminClose">✕</button>
      </div>
      <div class="admin-list" id="adminList"></div>
    </div>
  </div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyCadhKMGJ0nc9fWuB5BsMEixTyXSTAmtnk",
    authDomain: "mahy4-clicker.firebaseapp.com",
    databaseURL: "https://mahy4-clicker-default-rtdb.firebaseio.com",
    projectId: "mahy4-clicker",
    storageBucket: "mahy4-clicker.firebasestorage.app",
    messagingSenderId: "268929934750",
    appId: "1:268929934750:web:8ed46729d81bf334bc628f"
  };

  let db = null;
  try {
    firebase.initializeApp(firebaseConfig);
    db = firebase.database();
  } catch (e) {
    console.warn("Firebase not configured yet:", e);
  }

  const tg = window.Telegram ? window.Telegram.WebApp : null;
  if (tg) tg.ready();

  function getStoredGuestId() {
    let id = localStorage.getItem("mahy_account_id");
    if (!id) {
      id = "guest_" + Math.random().toString(36).slice(2, 10);
      localStorage.setItem("mahy_account_id", id);
    }
    return id;
  }

  const tgUser = tg && tg.initDataUnsafe && tg.initDataUnsafe.user ? tg.initDataUnsafe.user : null;
  const userId = tgUser ? String(tgUser.id) : getStoredGuestId();
  const userName = tgUser
    ? (tgUser.username ? "@" + tgUser.username : [tgUser.first_name, tgUser.last_name].filter(Boolean).join(" "))
    : "Guest";

  const ADMIN_IDS = ["7918319938", "7815477305"];
  const isAdmin = ADMIN_IDS.includes(userId);

  const scoreEl = document.getElementById("score");
  const recordEl = document.getElementById("record");
  const catBtn = document.getElementById("catBtn");
  const catWrap = document.getElementById("catWrap");
  const lbList = document.getElementById("lbList");
  const upgradeBtn = document.getElementById("upgradeBtn");
  const ppcValEl = document.getElementById("ppcVal");
  const upgradeCostLabel = document.getElementById("upgradeCostLabel");
  const perClickLabel = document.getElementById("perClickLabel");
  const rebirthBtn = document.getElementById("rebirthBtn");
  const rebirthMultVal = document.getElementById("rebirthMultVal");
  const rebirthCostLabel = document.getElementById("rebirthCostLabel");
  const adminToggle = document.getElementById("adminToggle");
  const adminOverlay = document.getElementById("adminOverlay");
  const adminClose = document.getElementById("adminClose");
  const adminList = document.getElementById("adminList");

  let score = 0;
  let record = 0;
  let upgradeLevel = 0;
  let pointsPerClick = 1;
  let rebirthLevel = 0;
  let saveTimeout = null;
  let audioCtx = null;
  let lastClickTime = 0;
  let clickIntervals = [];
  let botLockUntil = 0;
  let violationCount = 0;
  let violationDecayTimer = null;
  let lastPointerDownTime = 0;
  let noPointerStreak = 0;
  let sessionClickTimestamps = [];

  const MIN_CLICK_INTERVAL = 90;
  const SUSPICION_WINDOW = 10;
  const SUSPICION_STDDEV_THRESHOLD = 4;
  const LOCK_DURATION_BASE = 4000;
  const LOCK_DURATION_MAX = 60000;
  const BURST_WINDOW_MS = 3000;
  const BURST_MAX_CLICKS = 26; // ~8.7 clicks/sec sustained is well beyond human capability

  // Rebirth cost thresholds: 10k, 50k, 100k, 250k, 500k, 750k, 1m, then doubling
  const REBIRTH_THRESHOLDS = [10000, 50000, 100000, 250000, 500000, 750000, 1000000];

  function upgradeCost() {
    return Math.round(20 * Math.pow(1.55, upgradeLevel));
  }

  function rebirthCost(level) {
    if (level < REBIRTH_THRESHOLDS.length) return REBIRTH_THRESHOLDS[level];
    const last = REBIRTH_THRESHOLDS[REBIRTH_THRESHOLDS.length - 1];
    const extra = level - REBIRTH_THRESHOLDS.length + 1;
    return Math.round(last * Math.pow(2, extra));
  }

  function rebirthMultiplier() {
    return Math.pow(2, rebirthLevel);
  }

  function effectivePointsPerClick() {
    return pointsPerClick * rebirthMultiplier();
  }

  function formatNum(n) {
    return n.toLocaleString("en-US");
  }

  function refreshUI() {
    scoreEl.textContent = score;
    recordEl.textContent = record;
    ppcValEl.textContent = pointsPerClick;
    perClickLabel.textContent = `+${effectivePointsPerClick()} per click`;
    upgradeCostLabel.textContent = `Cost: ${upgradeCost()}`;
    if (score < upgradeCost()) {
      upgradeBtn.classList.add("disabled");
    } else {
      upgradeBtn.classList.remove("disabled");
    }

    const cost = rebirthCost(rebirthLevel);
    rebirthMultVal.textContent = "x" + rebirthMultiplier();
    const unlocked = record >= REBIRTH_THRESHOLDS[0];
    rebirthBtn.classList.remove("locked", "disabled");
    if (!unlocked) {
      rebirthCostLabel.textContent = `Locked — reach ${formatNum(REBIRTH_THRESHOLDS[0])} points`;
      rebirthBtn.classList.add("locked");
    } else {
      rebirthCostLabel.textContent = `Cost: ${formatNum(cost)} → x${rebirthMultiplier() * 2}`;
      if (score < cost) {
        rebirthBtn.classList.add("disabled");
      }
    }
  }

  function setControlsEnabled(enabled) {
    catBtn.disabled = !enabled;
    upgradeBtn.disabled = !enabled;
    rebirthBtn.disabled = !enabled;
  }

  function loadLocalFallback() {
    score = parseInt(localStorage.getItem("mahy_score") || "0", 10);
    record = parseInt(localStorage.getItem("mahy_record") || "0", 10);
    upgradeLevel = parseInt(localStorage.getItem("mahy_level") || "0", 10);
    pointsPerClick = parseInt(localStorage.getItem("mahy_ppc") || "1", 10);
    rebirthLevel = parseInt(localStorage.getItem("mahy_rebirth") || "0", 10);
  }

  function persistLocal() {
    localStorage.setItem("mahy_score", score);
    localStorage.setItem("mahy_record", record);
    localStorage.setItem("mahy_level", upgradeLevel);
    localStorage.setItem("mahy_ppc", pointsPerClick);
    localStorage.setItem("mahy_rebirth", rebirthLevel);
  }

  function playClickSound() {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(700, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(300, audioCtx.currentTime + 0.12);
      gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.13);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.13);
    } catch (e) {}
  }

  function playPurchaseSound() {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const now = audioCtx.currentTime;

      const dingFreqs = [1046.5, 1568.0];
      dingFreqs.forEach((freq, i) => {
        const start = now + i * 0.09;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "triangle";
        osc.frequency.setValueAtTime(freq, start);
        gain.gain.setValueAtTime(0.0001, start);
        gain.gain.exponentialRampToValueAtTime(0.22, start + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.35);
        osc.connect(gain).connect(audioCtx.destination);
        osc.start(start);
        osc.stop(start + 0.36);
      });

      const shimmer = audioCtx.createOscillator();
      const shimmerGain = audioCtx.createGain();
      shimmer.type = "sine";
      shimmer.frequency.setValueAtTime(2093.0, now + 0.1);
      shimmer.frequency.exponentialRampToValueAtTime(2637.0, now + 0.3);
      shimmerGain.gain.setValueAtTime(0.0001, now + 0.1);
      shimmerGain.gain.exponentialRampToValueAtTime(0.1, now + 0.13);
      shimmerGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.45);
      shimmer.connect(shimmerGain).connect(audioCtx.destination);
      shimmer.start(now + 0.1);
      shimmer.stop(now + 0.46);
    } catch (e) {}
  }

  function playRebirthSound() {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const now = audioCtx.currentTime;
      const sweep = audioCtx.createOscillator();
      const sweepGain = audioCtx.createGain();
      sweep.type = "sawtooth";
      sweep.frequency.setValueAtTime(220, now);
      sweep.frequency.exponentialRampToValueAtTime(1760, now + 0.5);
      sweepGain.gain.setValueAtTime(0.0001, now);
      sweepGain.gain.exponentialRampToValueAtTime(0.18, now + 0.1);
      sweepGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.6);
      sweep.connect(sweepGain).connect(audioCtx.destination);
      sweep.start(now);
      sweep.stop(now + 0.6);

      const chordFreqs = [523.25, 659.25, 783.99, 1046.5];
      chordFreqs.forEach((freq, i) => {
        const start = now + 0.35 + i * 0.03;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "triangle";
        osc.frequency.setValueAtTime(freq, start);
        gain.gain.setValueAtTime(0.0001, start);
        gain.gain.exponentialRampToValueAtTime(0.2, start + 0.03);
        gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.5);
        osc.connect(gain).connect(audioCtx.destination);
        osc.start(start);
        osc.stop(start + 0.5);
      });
    } catch (e) {}
  }

  function triggerBotLock() {
    violationCount++;
    clearTimeout(violationDecayTimer);
    violationDecayTimer = setTimeout(() => { violationCount = 0; }, 60000);

    const duration = Math.min(LOCK_DURATION_BASE * Math.pow(2, violationCount - 1), LOCK_DURATION_MAX);
    botLockUntil = Date.now() + duration;
    clickIntervals = [];
    sessionClickTimestamps = [];
    noPointerStreak = 0;
    catWrap.classList.add("locked");
    catBtn.disabled = true;
    if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("error");
    setTimeout(() => {
      catWrap.classList.remove("locked");
      catBtn.disabled = false;
    }, duration);
  }

  function spawnClickAnimation(e) {
    catBtn.classList.remove("pop");
    void catBtn.offsetWidth;
    catBtn.classList.add("pop");

    const ring = document.createElement("div");
    ring.className = "ring-pulse";
    catWrap.appendChild(ring);
    ring.addEventListener("animationend", () => ring.remove());

    const rect = catBtn.getBoundingClientRect();
    let x = rect.width / 2;
    let y = rect.height / 2;
    if (e && e.clientX) {
      x = e.clientX - rect.left;
      y = e.clientY - rect.top;
    }
    const pts = document.createElement("div");
    pts.className = "float-pts";
    pts.textContent = "+" + effectivePointsPerClick();
    pts.style.left = x + "px";
    pts.style.top = y + "px";
    pts.style.setProperty("--dx", (Math.random() * 40 - 20) + "px");
    catWrap.appendChild(pts);
    pts.addEventListener("animationend", () => pts.remove());
  }

  catBtn.addEventListener("pointerdown", (e) => {
    if (!e.isTrusted) return;
    lastPointerDownTime = Date.now();
  });

  catBtn.addEventListener("click", (e) => {
    if (!e.isTrusted) return;

    const now = Date.now();
    if (now < botLockUntil) return;

    // Autoclicker software running while the tab isn't focused/visible.
    if (document.hidden) {
      triggerBotLock();
      return;
    }

    if (now - lastClickTime < MIN_CLICK_INTERVAL) return;

    // A genuine click is always preceded by a real pointerdown shortly before it.
    // Synthetic clicks fired directly (no pointer sequence) are a strong bot signal.
    const hadRecentPointerDown = lastPointerDownTime > 0 && (now - lastPointerDownTime) < 2000;
    if (!hadRecentPointerDown) {
      noPointerStreak++;
      if (noPointerStreak >= 4) {
        triggerBotLock();
        return;
      }
    } else {
      noPointerStreak = 0;
    }

    // Sustained superhuman click rate over a short rolling window.
    sessionClickTimestamps.push(now);
    sessionClickTimestamps = sessionClickTimestamps.filter((t) => now - t <= BURST_WINDOW_MS);
    if (sessionClickTimestamps.length > BURST_MAX_CLICKS) {
      triggerBotLock();
      return;
    }

    if (lastClickTime > 0) {
      const interval = now - lastClickTime;
      clickIntervals.push(interval);
      if (clickIntervals.length > SUSPICION_WINDOW) clickIntervals.shift();

      if (clickIntervals.length === SUSPICION_WINDOW) {
        const avg = clickIntervals.reduce((a, b) => a + b, 0) / clickIntervals.length;
        const variance = clickIntervals.reduce((a, b) => a + Math.pow(b - avg, 2), 0) / clickIntervals.length;
        const stddev = Math.sqrt(variance);
        if (stddev < SUSPICION_STDDEV_THRESHOLD && avg < 400) {
          triggerBotLock();
          return;
        }
      }
    }
    lastClickTime = now;

    score += effectivePointsPerClick();
    if (score > record) record = score;

    playClickSound();
    spawnClickAnimation(e);
    refreshUI();
    persistLocal();

    if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred("light");

    clearTimeout(saveTimeout);
    saveTimeout = setTimeout(saveScoreToLeaderboard, 500);
  });

  upgradeBtn.addEventListener("click", (e) => {
    if (!e.isTrusted) return;
    const cost = upgradeCost();
    if (score < cost) {
      upgradeBtn.classList.remove("shake");
      void upgradeBtn.offsetWidth;
      upgradeBtn.classList.add("shake");
      if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("error");
      return;
    }
    score -= cost;
    upgradeLevel++;
    pointsPerClick++;

    refreshUI();
    persistLocal();
    playPurchaseSound();

    clearTimeout(saveTimeout);
    saveTimeout = setTimeout(saveScoreToLeaderboard, 500);

    upgradeBtn.classList.remove("bought");
    void upgradeBtn.offsetWidth;
    upgradeBtn.classList.add("bought");

    if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("success");
  });

  rebirthBtn.addEventListener("click", (e) => {
    if (!e.isTrusted) return;
    const unlocked = record >= REBIRTH_THRESHOLDS[0];
    if (!unlocked) return;

    const cost = rebirthCost(rebirthLevel);
    if (score < cost) {
      rebirthBtn.classList.remove("shake");
      void rebirthBtn.offsetWidth;
      rebirthBtn.classList.add("shake");
      if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("error");
      return;
    }

    score = 0;
    rebirthLevel++;

    refreshUI();
    persistLocal();
    playRebirthSound();

    clearTimeout(saveTimeout);
    saveTimeout = setTimeout(saveScoreToLeaderboard, 500);

    rebirthBtn.classList.remove("bought");
    void rebirthBtn.offsetWidth;
    rebirthBtn.classList.add("bought");

    if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred("success");
  });

  function saveScoreToLeaderboard() {
    if (!db) return;
    db.ref("leaderboard/" + userId).set({
      name: userName,
      score: score,
      record: record,
      ppc: pointsPerClick,
      level: upgradeLevel,
      rebirths: rebirthLevel,
      updatedAt: Date.now()
    }).catch((err) => {
      console.error("Save to Firebase failed:", err);
    });
  }

  function renderLeaderboard(entries) {
    if (!entries.length) {
      lbList.innerHTML = '<div class="lb-empty">No scores yet — be the first!</div>';
      return;
    }
    lbList.innerHTML = entries.map((e, i) => `
      <div class="lb-row">
        <div style="display:flex; align-items:center; overflow:hidden;">
          <span class="lb-rank">${i + 1}</span>
          <span class="lb-name">${escapeHtml(e.name)}</span>
        </div>
        <span class="lb-score">${e.score}</span>
      </div>
    `).join("");
  }

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  function listenToLeaderboard() {
    if (!db) {
      lbList.innerHTML = '<div class="lb-empty">Leaderboard not connected yet</div>';
      return;
    }
    db.ref("leaderboard").orderByChild("score").limitToLast(5).on("value", (snap) => {
      const val = snap.val() || {};
      const entries = Object.values(val).sort((a, b) => b.score - a.score);
      renderLeaderboard(entries);
    });
  }

  function listenToOwnData() {
    if (!db) {
      refreshUI();
      setControlsEnabled(true);
      return;
    }
    db.ref("leaderboard/" + userId).on("value", (snap) => {
      if (snap.exists()) {
        const data = snap.val();
        score = typeof data.score === "number" ? data.score : score;
        record = typeof data.record === "number" ? data.record : Math.max(record, score);
        pointsPerClick = typeof data.ppc === "number" ? data.ppc : pointsPerClick;
        upgradeLevel = typeof data.level === "number" ? data.level : upgradeLevel;
        rebirthLevel = typeof data.rebirths === "number" ? data.rebirths : rebirthLevel;
        persistLocal();
      } else {
        saveScoreToLeaderboard();
      }
      refreshUI();
      setControlsEnabled(true);
    }, (err) => {
      console.error("Firebase sync failed:", err);
      refreshUI();
      setControlsEnabled(true);
    });
  }

  function initPlayer() {
    loadLocalFallback();
    refreshUI();
    setControlsEnabled(false);
    listenToOwnData();
  }

  // Sync ID is intentionally not shown anywhere in the UI. Guests can still
  // access it via a long-press on the score (2s hold) to move progress
  // between devices, without exposing any ID visually by default.
  function setupAccountBox() {
    if (tgUser) return;
    let pressTimer = null;

    const openIdPrompt = () => {
      const input = prompt("Sync ID (use the same ID on another device to share your balance):", userId);
      if (input && input.trim() && input.trim() !== userId) {
        localStorage.setItem("mahy_account_id", input.trim());
        location.reload();
      }
    };

    const startPress = () => {
      clearTimeout(pressTimer);
      pressTimer = setTimeout(openIdPrompt, 2000);
    };
    const cancelPress = () => clearTimeout(pressTimer);

    scoreEl.addEventListener("pointerdown", startPress);
    scoreEl.addEventListener("pointerup", cancelPress);
    scoreEl.addEventListener("pointerleave", cancelPress);
    scoreEl.addEventListener("pointercancel", cancelPress);
  }

  function setupAdminPanel() {
    if (!isAdmin) return;
    adminToggle.style.display = "flex";
    adminToggle.addEventListener("click", () => {
      adminOverlay.style.display = "flex";
      loadAdminList();
    });
    adminClose.addEventListener("click", () => {
      adminOverlay.style.display = "none";
    });
    adminOverlay.addEventListener("click", (e) => {
      if (e.target === adminOverlay) adminOverlay.style.display = "none";
    });
  }

  function loadAdminList() {
    if (!db) return;
    adminList.innerHTML = '<div class="lb-empty">Loading...</div>';
    db.ref("leaderboard").once("value").then((snap) => {
      const val = snap.val() || {};
      const entries = Object.entries(val)
        .map(([id, d]) => ({ id, ...d }))
        .sort((a, b) => (b.score || 0) - (a.score || 0));

      if (!entries.length) {
        adminList.innerHTML = '<div class="lb-empty">No players yet</div>';
        return;
      }

      adminList.innerHTML = entries.map((e) => `
        <div class="admin-row" data-id="${escapeHtml(e.id)}">
          <div>
            <div class="admin-row-name">${escapeHtml(e.name || "Unknown")}</div>
            <div class="admin-row-meta">ID: ${escapeHtml(e.id)} · Score: ${e.score || 0} · Power: ${e.ppc || 1} · Rebirths: ${e.rebirths || 0}</div>
          </div>
          <div class="admin-row-actions">
            <input class="admin-add-input" type="number" placeholder="0">
            <button class="admin-add-btn">Add</button>
            <button class="admin-reset-btn">Reset</button>
          </div>
        </div>
      `).join("");

      adminList.querySelectorAll(".admin-add-btn").forEach((btn) => {
        btn.addEventListener("click", (ev) => {
          const row = ev.target.closest(".admin-row");
          const id = row.dataset.id;
          const input = row.querySelector(".admin-add-input");
          const amount = parseInt(input.value, 10);
          if (!Number.isFinite(amount) || amount === 0) return;
          db.ref("leaderboard/" + id).once("value").then((snap) => {
            const data = snap.val() || {};
            const newScore = (data.score || 0) + amount;
            const newRecord = Math.max(data.record || 0, newScore);
            db.ref("leaderboard/" + id).update({ score: newScore, record: newRecord })
              .then(loadAdminList)
              .catch((err) => {
                console.error("Admin add balance failed:", err);
                alert("Failed to save: " + err.message);
              });
          }).catch((err) => {
            console.error("Admin read failed:", err);
            alert("Failed to read player data: " + err.message);
          });
        });
      });

      adminList.querySelectorAll(".admin-reset-btn").forEach((btn) => {
        btn.addEventListener("click", (ev) => {
          const row = ev.target.closest(".admin-row");
          const id = row.dataset.id;
          if (confirm("Reset this player's score to 0?")) {
            db.ref("leaderboard/" + id).update({ score: 0, record: 0, ppc: 1, level: 0, rebirths: 0 })
              .then(loadAdminList)
              .catch((err) => {
                console.error("Admin reset failed:", err);
                alert("Failed to save: " + err.message);
              });
          }
        });
      });
    });
  }

  setupAccountBox();
  setupAdminPanel();

  listenToLeaderboard();
  initPlayer();
</script>
</body>
</html>
